html{font-synthesis:none}
:root{--ink:#3f6d0d;--gold:#ffd23f;--glass:rgba(255,255,255,.22);box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;font-family:"Matcha World",system-ui,sans-serif;color:#fff;background:linear-gradient(#1f9a45,#5fd04a)}
.sh{text-shadow:0 2px 8px rgba(59,113,7,.55)}
canvas#c{position:absolute;inset:0;width:100%;height:100%}
#warn{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 50%,rgba(255,50,80,.55))}
#wt{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:19px;opacity:0;pointer-events:none}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;justify-content:space-between;pointer-events:none}
#t{font-size:34px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 13px;font-size:13px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#lb{margin-top:8px;font-size:12px;line-height:1.75;min-width:132px;background:rgba(63,109,13,.45);border-radius:14px;padding:6px}
#lb div{display:flex;gap:7px;align-items:center;padding:0 6px;border-radius:7px}
#lb .me{background:rgba(255,210,63,.3);color:var(--gold)}
#lb i{width:10px;height:10px;border-radius:50%;flex:none}
#lb .out{opacity:.4}
#lb b{margin-left:auto}
#feed{text-align:right;font-size:12px;max-width:52vw}
#feed div{background:rgba(63,109,13,.6);padding:2px 10px;border-radius:10px;margin-bottom:3px;display:inline-block}
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd23f 55%,#f0a800);transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(59,113,7,.4)}
#mm{position:absolute;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:104px;height:104px;border-radius:50%;background:rgba(63,109,13,.35);border:2px solid rgba(255,255,255,.6)}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;touch-action:pan-y;text-align:center}
.ov.on{display:flex}
#menu{background:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 45%),linear-gradient(#1f9a45,#5fd04a)}
#over{background:rgba(63,109,13,.8);justify-content:center}
.top{display:flex;gap:8px;align-items:center;width:100%}
.lvl{font-size:12px;margin-left:auto;width:42%}
.bar{height:16px;background:rgba(63,109,13,.45);border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffe36b,#ffb800);width:0;transition:width .9s;border-radius:8px}
.bar span{position:absolute;inset:0;font-size:11px;line-height:16px}
h1{font-size:min(13vw,64px);line-height:.95;margin:2vh 0 0;letter-spacing:1px}
.hero{position:relative;margin:1vh 0}
#hero{width:min(58vw,240px);height:min(58vw,240px);display:block;position:relative;z-index:1}
.floe{position:absolute;left:50%;bottom:8%;width:96%;height:30%;transform:translateX(-50%);background:radial-gradient(ellipse,#fcfff3,#e5fdb4);border-radius:50%;box-shadow:0 12px 0 #c4f275,0 22px 28px rgba(67,123,7,.3)}
.who{background:var(--glass);border:1.5px solid rgba(255,255,255,.5);border-radius:14px;padding:7px 14px;font-size:12.5px;margin:12px 0;line-height:1.4}
.maps{display:flex;gap:8px}
.maps button{font-size:13px;background:rgba(255,255,255,.9);color:var(--ink);padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 rgba(63,109,13,.35)}
.maps button.sel{background:var(--gold)}
.maps button:disabled{opacity:.55}
.bottom{margin-top:auto;width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding-top:14px}

.slotBanner.t1{background:linear-gradient(#5fc3ff,#2a86d8);font-size:24px}
.slotBanner.t2{background:linear-gradient(#d78bff,#8a2be2)}
.slotBanner.t3{background:linear-gradient(#ffe45c,#ff8a00);font-size:36px;text-shadow:0 2px 0 #b35a00;box-shadow:0 0 40px #ffd23f;animation:slotBan 3.1s both,slotBanGlow .25s infinite alternate}
@keyframes slotBan{0%{opacity:0;transform:translateX(-50%) scale(.3)}12%{opacity:1;transform:translateX(-50%) scale(1.25)}22%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
@keyframes slotBanGlow{to{filter:brightness(1.25)}}
.slotFlash{position:absolute;inset:0;z-index:29;pointer-events:none;background:radial-gradient(circle,#fff6b8,rgba(255,246,184,0) 70%);animation:slotFlash .8s both}
@keyframes slotFlash{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
.slotCol.next .slotWin{border-color:#ffd23f;box-shadow:0 0 14px rgba(255,210,63,.9),inset 0 6px 12px rgba(0,0,0,.25),inset 0 -6px 12px rgba(0,0,0,.25)}
.slotCol.next .slotLab{animation:slotBlink .45s infinite alternate}
@keyframes slotBlink{to{opacity:.35}}
.slotCol.lock .slotWin{animation:slotLock .7s}
@keyframes slotLock{30%{filter:brightness(1.7) saturate(1.5);transform:scale(1.05)}}
.slotWin,.slotStrip{transition:height .4s ease,margin-top .4s ease}
.slotM.over .slotWin{height:76px}
.slotM.over .slotStrip{margin-top:-76px}
.slotM.over .slotWin::before{top:0}
.slotM.over .slotWin::after{background:none}
.slotM.over .slotLights:last-child{display:none}
.slotM.over{padding-bottom:6px}
.slotRec{margin-top:8px;gap:4px}
.slotRow{padding:3px 8px}
#slotGo{position:sticky;bottom:0;z-index:5;margin-top:8px}

/* --- DOPAMINE : drift, gemmes, paliers de vitesse --- */
#dopa{position:absolute;z-index:7;left:0;right:0;top:31%;text-align:center;pointer-events:none;opacity:0;font-size:32px;letter-spacing:1px;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 3px 0 #000}
#dopa.on{animation:dopaPop .75s ease-out both}
@keyframes dopaPop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}18%{opacity:1;transform:scale(1.25) rotate(2deg)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
#lvlUp{position:absolute;z-index:9;left:0;right:0;top:40%;text-align:center;pointer-events:none;opacity:0;font-size:min(13vw,56px);color:#fff;-webkit-text-stroke:5px #b34200;paint-order:stroke fill;text-shadow:0 6px 0 #b34200,0 0 30px rgba(255,200,0,.9)}
#lvlUp.on{animation:lvlUpA 1.3s ease-out both}
@keyframes lvlUpA{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}25%{transform:scale(1.12)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9) translateY(-30px)}}
#hud #spdPill{display:flex;width:max-content;margin-top:4px;font-size:12px;padding:2px 9px;gap:7px;white-space:nowrap;text-shadow:0 2px 0 rgba(10,60,20,.55)}
#spdPill i{display:inline-block;width:46px;height:7px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
#spdPill i b{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffe36b,#ff7a1a);border-radius:5px}
body:not([data-st=play]):not([data-st=dying]) #dopa,body:not([data-st=play]):not([data-st=dying]) #lvlUp{display:none}
.shopTabs{display:flex;gap:6px;margin:8px 0}.shopTabs button{flex:1;padding:8px 2px;border-radius:12px;border:2px solid #fff;background:rgba(255,255,255,.88);color:#477610;box-shadow:0 3px 0 #8cc92e;font-size:12px}.shopTabs button.sel{background:#ffe329}
.skinCard.poor{opacity:.6}

<body>
<div id="loader" role="button" aria-label="Passer"><canvas id="ldCv"></canvas><button class="ldSkip" id="ldSkip" type="button"></button><div class="ldBox"><div class="ldLogo" id="ldLogo"></div><div class="ldStage" id="ldStage"></div><div class="ldBar"><i id="ldFill"></i></div><div class="ldPct" id="ldPct">0%</div><div class="ldTip" id="ldTip"></div></div><div class="ldHint" id="ldHint"></div></div>
<script>
(function(){
// ====== RÉGLAGES DE L'ÉCRAN DE CHARGEMENT ======
const LOADER_STYLE='classic';  // 'arena' = nouveau (arène de glace, s'adapte à l'écran) · 'classic' = l'ancien (vert)
const LOADER_SKIP=false;     // true = on peut passer l'écran de chargement (tap / bouton / touche)
const DUR=6000;              // durée en ms
// ================================================
const L=document.getElementById('loader');if(!L)return;
L.classList.add(LOADER_STYLE);
let en=false;try{en=localStorage.getItem('dontstop_lang')==='en'}catch(e){}
const TIPS=en?['Near-miss a trail without touching it to recharge your power.','The player with the most eliminations is the king. Take them down!','In races, grab the bolts and hit the orange arrows.','Avoid the blue puddles: they slow you down.','Stay in a rival\'s slipstream to go faster.','An ice block is falling? Run from the red circle!','Ram a rival while boosting to slow them down.']
:['Frôle une traînée sans la toucher pour recharger ton pouvoir.','Le joueur avec le plus d\'éliminations est le roi. Fais-le tomber !','En course, ramasse les éclairs et fonce sur les flèches orange.','Évite les flaques bleues : elles te ralentissent.','Reste dans le sillage d\'un rival pour aller plus vite.','Un bloc de glace tombe ? Fuis le cercle rouge !','Percute un rival en turbo pour le ralentir.'];
const skipBtn=document.getElementById('ldSkip'),hint=document.getElementById('ldHint');
if(LOADER_SKIP){skipBtn.textContent=en?'SKIP »':'PASSER »';hint.textContent=en?'Tap anywhere to skip':'Touche l\'écran pour passer'}
else{skipBtn.remove();hint.remove();L.style.cursor='default';L.removeAttribute('role');L.removeAttribute('aria-label')}
document.getElementById('ldLogo').innerHTML=['DON\'T','STOP'].map((w,li)=>'<div class="ldL">'+[...w].map((ch,i)=>'<span style="--i:'+(i+li*5)+'">'+ch+'</span>').join('')+'</div>').join('');
const tip=document.getElementById('ldTip'),fill=document.getElementById('ldFill'),pct=document.getElementById('ldPct');
let ti=Math.random()*TIPS.length|0;tip.textContent=TIPS[ti];
const cv=document.getElementById('ldCv'),c=cv.getContext('2d');let W=0,H=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);c.setTransform(d,0,0,d,0,0)}
const TAU=Math.PI*2;

addEventListener('resize',()=>{rs();layout()});addEventListener('orientationchange',()=>setTimeout(()=>{rs();layout()},250));rs();

/* ---------- Style CLASSIC (l'ancien, vert) ---------- */
const COLS=['#ff2e93','#ffd23f','#7a4dff','#00d4ff','#ff5a36'];
const SK=Array.from({length:80},()=>({a:Math.random()*TAU,r:Math.random(),v:.3+Math.random()*.7,l:.06+Math.random()*.2,w:1+Math.random()*2.6}));
function drawClassic(c,T,W,H){
  const cx=W/2,cy=H*.4,rx=Math.min(W*.42,300),ry=rx*.34,maxr=Math.hypot(W,H)/2;
  c.lineCap='round';
  for(const s of SK){s.r+=s.v*.011*(1+T*.3);if(s.r>1){s.r=.1+Math.random()*.1;s.a=Math.random()*TAU}
    const r0=s.r*maxr,r1=Math.min(1.2,s.r*(1+s.l*2))*maxr,ca=Math.cos(s.a),sa=Math.sin(s.a);
    c.strokeStyle='rgba(255,255,255,'+(.06+.34*s.r)+')';c.lineWidth=s.w*(.4+s.r*1.5);c.beginPath();c.moveTo(cx+ca*r0,cy+sa*r0);c.lineTo(cx+ca*r1,cy+sa*r1);c.stroke()}
  c.save();c.translate(cx,cy);
  c.lineWidth=26;c.strokeStyle='rgba(8,70,30,.35)';c.beginPath();c.ellipse(0,10,rx,ry,0,0,TAU);c.stroke();
  c.lineWidth=22;c.strokeStyle='rgba(255,255,255,.92)';c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.stroke();
  c.lineWidth=16;c.strokeStyle='#f1fbd8';c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.stroke();
  c.setLineDash([22,20]);c.lineDashOffset=-T*60;c.lineWidth=3;c.strokeStyle='rgba(120,190,60,.6)';c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.stroke();c.setLineDash([]);
  const os=COLS.map((col,i)=>{const a=T*(2.1+i*.07)+i*TAU/COLS.length;return{col,a,x:Math.cos(a)*rx,y:Math.sin(a)*ry,z:Math.sin(a),i}}).sort((p,q)=>p.z-q.z);
  for(const o of os){
    const sc=.75+.35*(o.z+1)/2,sp=2.1+o.i*.07;
    for(let k=1;k<=22;k++){const f=1-k/22,a0=o.a-(k-1)*.05*sp/2.1,a1=o.a-k*.05*sp/2.1;c.globalAlpha=.7*f;c.strokeStyle=o.col;c.lineWidth=(3+13*f)*sc;
      c.beginPath();c.moveTo(Math.cos(a0)*rx,Math.sin(a0)*ry);c.lineTo(Math.cos(a1)*rx,Math.sin(a1)*ry);c.stroke()}
    c.globalAlpha=1;c.fillStyle='rgba(8,60,20,.3)';c.beginPath();c.ellipse(o.x,o.y+13*sc,11*sc,4*sc,0,0,TAU);c.fill();
    c.beginPath();c.arc(o.x,o.y,12*sc,0,TAU);c.fillStyle=o.col;c.fill();c.lineWidth=3*sc;c.strokeStyle=o.i===1?'#ffd23f':'#fff';c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(o.x+4*sc,o.y-3*sc,2.8*sc,0,TAU);c.fill()}
  c.restore()}

/* ---------- Style ARENA (nouveau : l'arène de glace qui rétrécit, comme dans le jeu) ---------- */
const ARC=['#ff2e93','#ffd23f','#7a4dff','#00d4ff','#ff5a36'],ARR=[.25,.9,.8,.68,.55,.42];
const AR={last:0,parts:[],rings:[],
  orbs:ARC.map((col,i)=>({col,rad:ARR[i],ph:Math.random()*TAU,w:i===0?2.6:(i%2?-1:1)*(1.2+(1-ARR[i])*1.6),tr:[],dead:false})),
  cracks:Array.from({length:9},(_,i)=>{let ang=i*TAU/9+Math.random()*.4,r=.1;const pts=[[Math.cos(ang)*r,Math.sin(ang)*r]];for(let k=0;k<6;k++){ang+=(Math.random()-.5)*.7;r+=.09+Math.random()*.07;pts.push([Math.cos(ang)*r,Math.sin(ang)*r])}return pts})};
const stg={cx:0,cy:0,R:0},stage=document.getElementById('ldStage');
// l'arène se cale sur la place réellement disponible (portrait, paysage, encoche, petit écran, grand écran…)
function layout(){if(LOADER_STYLE!=='arena')return;const r=stage.getBoundingClientRect();stg.cx=r.left+r.width/2;stg.cy=r.top+r.height/2;stg.R=Math.max(0,Math.min(Math.min(r.width,r.height)/2/1.08-4,330))}
function burst(x,y,col,R){for(let k=0;k<20;k++){const a=Math.random()*TAU,v=R*(.4+Math.random()*.9);AR.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7+Math.random()*.3,col})}AR.rings.push({x,y,t:0,col})}
function crownAt(c,x,y,sc){c.save();c.translate(x,y);c.scale(sc,sc);c.beginPath();c.moveTo(-12,6);c.lineTo(-14,-8);c.lineTo(-6,-2);c.lineTo(0,-12);c.lineTo(6,-2);c.lineTo(14,-8);c.lineTo(12,6);c.closePath();c.fillStyle='#ffd23f';c.fill();c.lineWidth=2.2;c.strokeStyle='#000';c.lineJoin='round';c.stroke();c.restore()}
function drawArena(c,T,W,H,pe,now){
  const cx=stg.cx,cy=stg.cy,R=stg.R;if(!(R>20))return;
  const dt=Math.min(.05,AR.last?(now-AR.last)/1000:.016);AR.last=now;
  const Rz=R*(1-.62*pe),maxr=Math.hypot(W,H)/2;
  // lignes de vitesse (comme l'ancien écran)
  c.lineCap='round';
  for(const s of SK){s.r+=s.v*.011*(1+T*.3);if(s.r>1){s.r=.1+Math.random()*.1;s.a=Math.random()*TAU}
    const r0=s.r*maxr,r1=Math.min(1.2,s.r*(1+s.l*2))*maxr,ca=Math.cos(s.a),sa=Math.sin(s.a);
    c.strokeStyle='rgba(255,255,255,'+(.05+.28*s.r)+')';c.lineWidth=s.w*(.4+s.r*1.5);c.beginPath();c.moveTo(cx+ca*r0,cy+sa*r0);c.lineTo(cx+ca*r1,cy+sa*r1);c.stroke()}
  // ombre + eau
  c.fillStyle='rgba(8,60,20,.3)';c.beginPath();c.ellipse(cx,cy+R*.1,R*1.06,R*1.0,0,0,TAU);c.fill();
  let g=c.createRadialGradient(cx,cy,R*.2,cx,cy,R);g.addColorStop(0,'#3fd0f0');g.addColorStop(1,'#168fc4');c.fillStyle=g;c.beginPath();c.arc(cx,cy,R,0,TAU);c.fill();
  c.lineWidth=2;for(let k=0;k<3;k++){const f=((T*.45+k/3)%1),rr=Rz+(R-Rz)*f;c.globalAlpha=(1-f)*.6;c.strokeStyle='#d9f6ff';c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke()}c.globalAlpha=1;
  // banquise qui rétrécit + fissures qui apparaissent
  g=c.createRadialGradient(cx-Rz*.25,cy-Rz*.3,Rz*.1,cx,cy,Rz);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#bfeaf4');c.fillStyle=g;c.beginPath();c.arc(cx,cy,Rz,0,TAU);c.fill();
  c.save();c.beginPath();c.arc(cx,cy,Rz,0,TAU);c.clip();c.strokeStyle='rgba(90,160,190,.75)';c.lineWidth=Math.max(1,R*.008);c.lineJoin='round';
  AR.cracks.forEach((pts,i)=>{if(i>pe*AR.cracks.length+1)return;const n=Math.max(2,Math.ceil(pts.length*Math.min(1,pe*1.6+.15)));c.beginPath();for(let k=0;k<n;k++){const p=pts[k],x=cx+p[0]*R,y=cy+p[1]*R;k?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()});c.restore();
  c.lineWidth=R*.035;c.strokeStyle='#fff';c.beginPath();c.arc(cx,cy,Rz,0,TAU);c.stroke();
  c.setLineDash([R*.06,R*.045]);c.lineDashOffset=-T*30;c.lineWidth=Math.max(2,R*.016);c.strokeStyle='#ff5a36';c.beginPath();c.arc(cx,cy,Rz+R*.035,0,TAU);c.stroke();c.setLineDash([]);
  c.lineWidth=R*.07;c.strokeStyle='rgba(255,255,255,.95)';c.beginPath();c.arc(cx,cy,R+R*.035,0,TAU);c.stroke();
  c.lineWidth=R*.035;c.strokeStyle='#f1fbd8';c.beginPath();c.arc(cx,cy,R+R*.035,0,TAU);c.stroke();
  // orbes : les extérieurs tombent à l'eau quand la zone rétrécit, le rose reste
  const or=Math.max(7,R*.058);
  for(const o of AR.orbs){if(o.dead)continue;const a=o.ph+o.w*T,r=o.rad*R,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;o.x=x;o.y=y;
    if(r>Rz-or*.6){o.dead=true;o.tr.length=0;burst(x,y,o.col,R);continue}
    o.tr.push({x,y});if(o.tr.length>34)o.tr.shift()}
  const alive=AR.orbs.filter(o=>!o.dead).sort((p,q)=>(p===AR.orbs[0])-(q===AR.orbs[0]));
  for(const o of alive){const tr=o.tr,pl=o===AR.orbs[0];c.strokeStyle=o.col;
    for(let k=1;k<tr.length;k++){const f=k/tr.length;c.globalAlpha=.75*f*f;c.lineWidth=(2+or*1.1*f)*(pl?1.2:1);c.beginPath();c.moveTo(tr[k-1].x,tr[k-1].y);c.lineTo(tr[k].x,tr[k].y);c.stroke()}c.globalAlpha=1}
  for(const o of alive){const pl=o===AR.orbs[0],rr=or*(pl?1.25:1);
    c.fillStyle='rgba(8,60,20,.25)';c.beginPath();c.ellipse(o.x,o.y+rr*.9,rr*.9,rr*.35,0,0,TAU);c.fill();
    c.save();if(pl){c.shadowColor=o.col;c.shadowBlur=rr*1.6}
    c.beginPath();c.arc(o.x,o.y,rr,0,TAU);c.fillStyle=o.col;c.fill();c.lineWidth=Math.max(2,rr*.22);c.strokeStyle=pl?'#ffd23f':'#fff';c.stroke();c.restore();
    c.fillStyle='#fff';c.beginPath();c.arc(o.x+rr*.32,o.y-rr*.3,rr*.24,0,TAU);c.fill()}
  // éclaboussures
  for(let i=AR.parts.length-1;i>=0;i--){const p=AR.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt;if(p.l<=0){AR.parts.splice(i,1);continue}c.globalAlpha=Math.min(1,p.l*1.6);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,Math.max(2,R*.014),0,TAU);c.fill()}
  for(let i=AR.rings.length-1;i>=0;i--){const q=AR.rings[i];q.t+=dt*2;if(q.t>1){AR.rings.splice(i,1);continue}c.globalAlpha=1-q.t;c.strokeStyle='#fff';c.lineWidth=2.5;c.beginPath();c.arc(q.x,q.y,R*.02+q.t*R*.16,0,TAU);c.stroke()}
  c.globalAlpha=1;
  // victoire : couronne sur l'orbe rose
  if(pe>.9){const p0=AR.orbs[0],k=Math.min(1,(pe-.9)/.08),bounce=1+.12*Math.sin(T*6);crownAt(c,p0.x,p0.y-or*1.9,or*.1*k*bounce)}
}

let t0=performance.now(),raf=0,gone=false,lastTip=0,fc=0;
function frame(now){
  if(gone)return;
  const el=now-t0,T=el/1000,p=Math.min(1,el/DUR),pe=1-Math.pow(1-p,1.7),v=Math.floor(100*pe);
  c.clearRect(0,0,W,H);
  if(LOADER_STYLE==='classic')drawClassic(c,T,W,H,pe);else{if(++fc%10===1)layout();drawArena(c,T,W,H,p,now)}
  fill.style.width=v+'%';pct.textContent=v+'%';
  if(el-lastTip>1500){lastTip=el;ti=(ti+1)%TIPS.length;tip.style.opacity=0;setTimeout(()=>{tip.textContent=TIPS[ti];tip.style.opacity=1},220)}
  if(p>=1){pct.textContent=en?'READY!':'PRÊT !';setTimeout(bye,350);gone=true;return}
  raf=requestAnimationFrame(frame)}
let leaving=false;
function bye(){if(leaving)return;leaving=true;gone=true;cancelAnimationFrame(raf);
  const m=document.getElementById('menu');if(m&&m.classList.contains('on')){m.classList.remove('on');void m.offsetWidth;m.classList.add('on')}
  L.classList.add('out');setTimeout(()=>{L.remove()},520)}
if(LOADER_SKIP)L.addEventListener('pointerdown',e=>{e.preventDefault();bye()});
// tant que l'écran est là, les touches ne doivent pas piloter le jeu derrière
addEventListener('keydown',e=>{if(document.getElementById('loader')){e.stopPropagation();e.preventDefault();if(LOADER_SKIP&&!leaving)bye()}},true);
layout();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
raf=requestAnimationFrame(frame);
})();
</script>
<canvas id="c"></canvas>
<div id="warn"></div><div id="wt" class="sh">⚠ Retourne vers le centre !</div>
<div id="toast"></div><div id="dopa" class="sh"></div><div id="lvlUp"></div><button id="boostBtn" aria-label="Pouvoir spécial"><span id="boostIc">⚡</span><span id="boostLabel"></span><span id="boostName">BOOST</span></button><div id="hud"><div><div id="t" class="sh">0.0</div><div class="pill" id="sub" style="margin-top:6px"></div><div class="pill" id="spdPill"><span id="spdT"></span><i><b id="spdB"></b></i></div><div id="lb"></div></div><div id="feed"></div><button id="pauseBtn" aria-label="Pause">Ⅱ</button></div>
<div id="joy"><div id="knob"></div></div>
<canvas id="mm" width="208" height="208"></canvas>
<div id="cd"><div id="cdn" class="sh"></div><div class="w">Tu es l'orbe à <b style="color:var(--gold)">contour doré</b> (TOI)</div></div>

<div class="ov on" id="menu"><canvas id="bgfx"></canvas>
  <div class="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🏆 <span id="tr">0</span></div>
    <button class="ic" id="accBtn" aria-label="Compte">?</button><button class="ic" id="dailyBtn" aria-label="Cadeau quotidien">🎁</button><button class="ic" id="helpBtn" aria-label="Aide">❔</button>
    <div class="lvl"><div id="lv" style="text-align:right;margin-bottom:3px">Niv. 1</div><div class="bar"><i id="xb"></i><span id="xpt"></span></div></div></div>
  <h1 class="sh">DON'T<br>STOP</h1>
  <div class="hero"><div class="floe"></div><canvas id="hero" width="480" height="480"></canvas></div>
  <div class="maps" id="maps"></div>
  <div class="modeRow" id="modeRow"><button data-mode="classic" class="sel">⭐ CLASSIQUE</button><button data-mode="rush">⚡ RAPIDE</button><button data-mode="survival">🌊 SURVIE</button><button data-mode="hunt">🎯 CHASSEUR</button><button data-mode="race">🏁 COURSE</button></div>
  <div class="bottom">

  // obstacles proches : traînées (hors queue immédiate), têtes adverses prédites, mines
  const pts=[];
  for(const q of P){
    const tr=q.trail,n=q===p?tr.length-40:tr.length;
    for(let i=0;i<n;i++){const d=tr[i],dx=d.x-p.x,dy=d.y-p.y;if(dx*dx+dy*dy<R2)pts.push(d)}
    if(q!==p&&q.alive&&q!==p.chase){const dx=q.x-p.x,dy=q.y-p.y;if(dx*dx+dy*dy<R2)for(const k of [.2,.4,.6])pts.push({x:q.x+Math.cos(q.a)*sp*k,y:q.y+Math.sin(q.a)*sp*k})}
  }

  const free=(x,y)=>{
    if(NR(x,y)>zoneR-16)return false;

    for(const f of falls)if((x-f.x)**2+(y-f.y)**2<(f.r+24)**2)return false;
    for(const m of mets)if((x-m.x)**2+(y-m.y)**2<(m.r+30)**2)return false;
    for(const d of pts)if((x-d.x)**2+(y-d.y)**2<324)return false;
    return true};
  const angd=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));
  // objectif : bonus proche, sinon couper la route d'un adversaire, sinon rester au centre quand la zone rétrécit

  if(gA===null&&(p.skill>.915||p.hu||p.chase)){
    let bq=null,bdq=p.hu?900:(p.chase?460:340);
    for(const q of P){if(q===p||!q.alive)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(q===p.chase&&d<460){bq=q;bdq=d;break}if(d<bdq){bdq=d;bq=q}}
    if(bq){p.chase=bq;const lead=Math.max(.5,Math.min(1.2,bdq/sp)*1.2);gA=Math.atan2(bq.y+Math.sin(bq.a)*sp*lead-p.y,bq.x+Math.cos(bq.a)*sp*lead-p.x);gW=p.hu?1.2:.95}else p.chase=null
  }
  const toC=Math.atan2(-p.y,-p.x),dc=NR(p.x,p.y),edge=dc>zoneR-look*1.4||(t>8&&dc>zoneR*.72);
  let best=p.a,bc=1e9,allBad=true,centerClear=look;
  for(let k=0;k<13;k++){
    const off=(k-6)*.3,a=p.a+off;let c=Math.abs(off)*5+Math.random()*1.5,clear=look;
    for(let d=22;d<=look;d+=20)if(!free(p.x+Math.cos(a)*d,p.y+Math.sin(a)*d)){clear=d;break}
    if(k===6)centerClear=clear;
    if(clear<look){c+=(look-clear)*3+(clear<look*.5?200:0)}else{allBad=false;if(!free(p.x+Math.cos(a)*look*1.7,p.y+Math.sin(a)*look*1.7))c+=22}
    if(gA!==null)c+=angd(a,gA)*gW*8;
    if(edge)c+=angd(a,toC)*(dc>zoneR-look?30:12);
    if(c<bc){bc=c;best=a}
  }
  // petite chance de rater un virage seulement quand il y a danger
  if(centerClear<look*.7&&Math.random()>p.skill)return;
  p.tgt=best;
  // les bots utilisent aussi un bouclier d'urgence
  if((allBad||centerClear<look*.3)&&p.sh<=0&&!p.pw){p.sh=1.4;p.pw=9}
}

function openLeague(){
  const tr=S.tr,N=LGT.length,H=230,BP=110,TP=150,TOT=N*H+BP+TP;
  let t=0;for(let k=0;k<N;k++)if(tr>=LGT[k].min)t=k;
  const f=t===N-1?.5:Math.min(1,(tr-LGT[t].min)/50);
  const yFromBottom=(t+f)*H,Y=y=>TOT-BP-y;   // y depuis le haut
  const yMe=Y(yFromBottom);
  let h='';for(let L=0;L<=LAST;L++){const k0=L*3,k1=L===LAST?k0:k0+2,top=L===LAST?0:Y((k1+1)*H),bot=Y(k0*H-(L===0?BP:0));h+=`<div class="lgBand" style="top:${top}px;height:${bot-top}px;--bg:${BGC[L]}"></div>`}

  for(let k=0;k<N;k++){
    const T=LGT[k],reached=tr>=T.min,cur=k===t,yp=Y(k*H);
    h+=`<div class="lgBadgeW ${cur?'cur':''}" style="top:${yp-H+8}px;height:${H-70}px">${lgBadge2(T.L,T.st,k===N-1?150:132,!reached,cur)}</div>`;
    h+=`<div class="lgThr ${reached?'':'dim'}" style="top:${yp-14}px">${T.min.toLocaleString('fr-FR')}</div>`;
    h+=`<div class="lgPlaque ${reached?'':'lock'}" style="top:${yp-27}px;--c1:${LGC[T.L][0]};--c2:${LGC[T.L][1]}"><span>${T.n}</span></div>`;
  }
  const nx=LGT[t+1];
  h+=`<div class="lgMe" style="top:${yMe-21}px"><span>${tr}</span> 🏆</div>`;
  if(nx)h+=`<div class="lgGo" style="top:${yMe-16}px">+${nx.min-tr} 🏆 pour <b>${nx.n}</b></div>`;
  $('lgScroll').innerHTML=`<div class="lgCanvas" style="height:${TOT}px">${h}</div>`;

const okCol=c=>/^#[0-9a-f]{6}$/i.test(c||'');
const accCol=a=>okCol(a.color)?a.color:avCol(a.name);
const okPhoto=a=>!!a.photo&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(a.photo);
const avStyle=a=>okPhoto(a)?`background:url(${a.photo}) center/cover`:`background:${accCol(a)}`;
const avTxt=a=>okPhoto(a)?'':esc(AVE.includes(a.av)?a.av:a.name[0].toUpperCase());
const avBox=(a,cls='')=>`<div class="accAv ${cls}" style="${avStyle(a)}">${avTxt(a)}</div>`;
function accPatch(id,patch){const L=accList(),a=L.find(x=>x.id===id);if(!a)return null;Object.assign(a,patch);accSave(L);return a}
function refreshAccBtn(){const a=curAcc(),b=$('accBtn');if(!a||!b)return;b.textContent=okPhoto(a)?'':(AVE.includes(a.av)?a.av:a.name[0].toUpperCase());b.style.background=okPhoto(a)?`url(${a.photo}) center/cover`:accCol(a);b.style.color='#fff'}
function accInfo(id){try{const d=JSON.parse(LSRAW.getItem(id+':dontstop4')||'{}');return{tr:d.tr||0,games:d.games||0}}catch(e){return{tr:0,games:0}}}
function curAcc(){return accList().find(a=>a.id===ACC)}
function loadAccount(id,login){
  ACC=id;LSRAW.setItem('dontstop_cur',id);
  S={xp:0,games:0,bt:0,br:9,map:0,coins:0,tr:0};
  try{Object.assign(S,JSON.parse(LS.getItem('dontstop4')||'{}'))}catch(e){}
  ownedSkins=[0];try{ownedSkins=JSON.parse(LS.getItem('dontstop_skins')||'[0]')}catch(e){}
  activeSkin=0;try{activeSkin=+(LS.getItem('dontstop_active_skin')||0)}catch(e){}
  loadShop2();
  const a=curAcc();NAMES[0]=a?a.name.toUpperCase():'TOI';
  refreshAccBtn();gameMode='classic';try{gameMode=LS.getItem('dontstop_mode')||'classic'}catch(e){}
  $('accScreen').classList.remove('show');closeFeature();menu();
  if(a&&S.games)postScore();
  if(login&&a){toast('Connecté : '+a.name);sendLoginMail(a)}
}


/* ===== Mail de confirmation à la connexion =====
   Un fichier HTML ne peut pas envoyer d'e-mail seul : il faut un petit service.
   Colle ici l'URL de ton Google Apps Script (voir explications) pour activer l'envoi. */
const MAIL_URL='https://script.google.com/macros/s/AKfycbwY3TBG2XbEnGgMhIcqDZ4_z5bjyLBKETx9WByN_ulb3xyICOGzR-J8H3lWh62EDpk/exec';
function sendLoginMail(a){
  if(!a.mail||!MAIL_URL)return;
  try{fetch(MAIL_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({to:a.mail,name:a.name})}).catch(()=>{})}catch(e){}
}

/* ===== Classement mondial ===== */
function postScore(){
  const a=curAcc();if(!a||!MAIL_URL)return;
  try{fetch(MAIL_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'score',id:a.id,name:a.name,c:accCol(a),av:AVE.includes(a.av)?a.av:'',tr:S.tr,bt:+(S.bt||0).toFixed(1),w:S.wins||0,g:S.games||0,l:lv(S.xp).l})}).catch(()=>{})}catch(e){}
}
let lbData=null,lbTab='tr';
function lbRender(){
  const d=lbData,list=lbTab==='tr'?d.byTr:d.byBt,med=['🥇','🥈','🥉'];
  const rows=list.map((p,i)=>`<div class="lbRow${p.m?' me':''}"><span class="lbPos">${med[i]||i+1}</span><span class="lbAv" style="background:${okCol(p.c)?p.c:'#64748b'}">${esc(AVE.includes(p.av)?p.av:String(p.n||'?')[0].toUpperCase())}</span><span class="lbName">${esc(p.n)}<small>Niv. ${+p.l||1} · ${+p.w||0} vict.</small></span><b>${lbTab==='tr'?'🏆 '+(+p.tr||0):(+p.bt||0).toFixed(1)+' s'}</b></div>`).join('');
  const me=d.me?`<p class="lbMe">Ton rang : <b>#${lbTab==='tr'?d.me.rt:d.me.rb}</b> sur ${d.total} joueur${d.total>1?'s':''}</p>`:'<p class="fine">Joue une partie pour apparaître dans le classement !</p>';
  openFeature(`<h2>🏆 CLASSEMENT MONDIAL</h2><div class="lbTabs"><button data-t="tr" class="${lbTab==='tr'?'sel':''}">🏆 TROPHÉES</button><button data-t="bt" class="${lbTab==='bt'?'sel':''}">⏱️ RECORD</button></div>${me}${rows||'<p class="fine">Aucun joueur pour le moment.</p>'}<p class="fine">Seuls ton pseudo et tes stats sont partagés.</p>`);
  $('modalContent').querySelectorAll('.lbTabs button').forEach(b=>b.onclick=()=>{lbTab=b.dataset.t;lbRender()});
}
async function openTop(){
  openFeature('<h2>🏆 CLASSEMENT MONDIAL</h2><p class="fine">Chargement…</p>');
  const a=curAcc(),ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(MAIL_URL+'?a=top&id='+encodeURIComponent(a?a.id:''),{signal:ctl.signal,cache:'no-store'});
    const d=await r.json();
    if(!$('featureModal').classList.contains('show'))return;
    lbData=d;lbRender();
  }catch(e){
    if(!$('featureModal').classList.contains('show'))return;
    openFeature('<h2>🏆 CLASSEMENT MONDIAL</h2><p>Impossible de charger le classement pour le moment. Vérifie ta connexion et réessaie.</p><button class="bigAction" id="lbRetry">RÉESSAYER</button>');
    const b=$('lbRetry');if(b)b.onclick=openTop;
  }finally{clearTimeout(to)}
}
$('topBtn').onclick=openTop;
let accMode='list',accSel=null,accMsg='',accDel=null,accDr={};
function accGrab(){const n=$('accName'),p=$('accPin'),m=$('accMail');if(accMode==='edit'&&n)accDr={name:n.value,pin:p?p.value:'',mail:m?m.value:''}}
const accFile=document.createElement('input');accFile.type='file';accFile.accept='image/*';
accFile.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';document.body.appendChild(accFile);
function accPhotoFail(m){accMsg=m;accRender()}
function accPhotoDone(src,w,h){
  try{
    const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),m=Math.min(w,h);
    x.fillStyle='#fff';x.fillRect(0,0,96,96);
    x.drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,96,96);
    const url=c.toDataURL('image/jpeg',.8);
    if(!/^data:image\/jpeg;base64,/.test(url)){accPhotoFail('Photo non supportée');return}
    accPatch(ACC,{photo:url});refreshAccBtn();accMsg='';accRender();
  }catch(e){accPhotoFail('Impossible de charger la photo')}
}
accFile.onchange=()=>{
  const f=accFile.files&&accFile.files[0];if(!f)return;
  // on ne vide l'input qu'à la fin : sur iOS le fichier devient illisible si on le vide avant de le lire
  const done=()=>{try{accFile.value=''}catch(e){}};
  const viaImg=()=>{
    const fr=new FileReader();
    fr.onerror=()=>{accPhotoFail('Image illisible');done()};
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{accPhotoDone(im,im.naturalWidth||im.width,im.naturalHeight||im.height);done()};
      im.onerror=()=>{accPhotoFail('Image illisible (essaie une capture d\'écran ou un JPG)');done()};
      im.src=fr.result};
    fr.readAsDataURL(f)};
  if(window.createImageBitmap){
    createImageBitmap(f,{imageOrientation:'from-image'}).then(b=>{accPhotoDone(b,b.width,b.height);if(b.close)b.close();done()}).catch(viaImg)
  }else viaImg();
};
function accRender(){
  const L=accList(),box=$('accBox');
  let h='';
  if(accMode==='list'&&!L.length)accMode='create';
  if(accMode==='list'){
    h+=`<h2>COMPTES</h2><p class="accSub">Choisis ton profil pour retrouver ta progression.</p><div class="accList">`+L.map(a=>{
      const inf=accInfo(a.id),cur=a.id===ACC;
      return `<div class="accCard ${cur?'cur':''}" data-act="pick" data-id="${a.id}">${avBox(a)}<div class="accTx"><b>${esc(a.name)}</b><small>${league(inf.tr)} · ${inf.tr} 🏆</small></div>${a.pin?'<span class="accLk">'+icoW('lock')+'</span>':''}${cur?'<span class="lgYou">ACTIF</span>':''}<button class="accDel ${accDel===a.id?'sure':''}" data-act="del" data-id="${a.id}" aria-label="Supprimer">${accDel===a.id?'SÛR ?':'✕'}</button></div>`}).join('')+`</div>`;
    if(ACC&&curAcc())h+=`<button class="bigAction" data-act="edit">✏️ MODIFIER MON PROFIL</button>`;
    h+=`<button class="${ACC&&curAcc()?'softAction':'bigAction'}" data-act="new">+ NOUVEAU COMPTE</button>`;
    if(ACC&&curAcc())h+=`<button class="softAction" data-act="close">RETOUR</button>`;
  }else if(accMode==='create'){
    h+=`<h2>NOUVEAU COMPTE</h2><label class="accLb">Pseudo</label><input id="accName" maxlength="10" autocomplete="off" autocapitalize="off" placeholder="2 à 10 caractères"><label class="accLb">Code secret (facultatif)</label><input id="accPin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 chiffres"><label class="accLb">Gmail (facultatif)</label><input id="accMail" type="email" maxlength="60" autocomplete="off" autocapitalize="off" placeholder="toi@gmail.com"><p class="accMsg">${accMsg}</p><button class="bigAction" data-act="make">CRÉER</button>${L.length?'<button class="softAction" data-act="list">RETOUR</button>':''}<p class="fine">Les comptes sont enregistrés sur cet appareil.</p>`;
  }else if(accMode==='edit'){
    const a=curAcc();if(!a){accMode='list';accRender();return}
    const dr=accDr||{};
    h+=`<h2>MON PROFIL</h2>${avBox(a,'big')}<button class="softAction" data-act="photo">📷 ${okPhoto(a)?'CHANGER':'AJOUTER'} LA PHOTO</button>${okPhoto(a)?'<button class="softAction" data-act="rmphoto">RETIRER LA PHOTO</button>':''}`+
    `<label class="accLb">Couleur</label><div class="swGrid">${SWC.map(c=>`<button class="sw ${accCol(a).toLowerCase()===c?'sel':''}" style="background:${c}" data-act="color" data-v="${c}" aria-label="Couleur"></button>`).join('')}</div>`+
    `<label class="accLb">Avatar</label><div class="swGrid"><button class="emo ${AVE.includes(a.av)?'':'sel'}" data-act="emo" data-v="">${esc(a.name[0].toUpperCase())}</button>${AVE.map(e=>`<button class="emo ${a.av===e?'sel':''}" data-act="emo" data-v="${e}">${e}</button>`).join('')}</div>`+
    `<label class="accLb">Pseudo <small style="opacity:.7">(changer = ${NAME_COST} 🪙 · tu en as ${S.coins})</small></label><input id="accName" maxlength="10" autocomplete="off" autocapitalize="off" value="${esc(dr.name!=null?dr.name:a.name)}">`+
    `<label class="accLb">Code secret</label><input id="accPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="${a.pin?'Laisser vide = inchangé':'4 chiffres (facultatif)'}" value="${esc(dr.pin||'')}">${a.pin?'<button class="softAction" data-act="rmpin">SUPPRIMER LE CODE</button>':''}`+
    `<label class="accLb">Gmail</label><input id="accMail" type="email" maxlength="60" autocomplete="off" autocapitalize="off" placeholder="toi@gmail.com" value="${esc(dr.mail!=null?dr.mail:(a.mail||''))}">`+
    `<p class="accMsg">${accMsg}</p><button class="bigAction" data-act="save">ENREGISTRER</button><button class="softAction" data-act="list">RETOUR</button>`;
  }else if(accMode==='pin'){
    const a=L.find(x=>x.id===accSel);
    h+=`<h2>${esc(a?a.name:'')}</h2><p class="accSub">Entre ton code secret.</p><input id="accPin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" type="password"><p class="accMsg">${accMsg}</p><button class="bigAction" data-act="unlock">OK</button><button class="softAction" data-act="list">RETOUR</button>`;
  }
  box.innerHTML=h;
}
function accOpen(mode){accMode=mode||'list';accMsg='';accDel=null;accRender();$('accScreen').classList.add('show')}
$('accBox').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act,id=t.dataset.id,L=accList();
  if(act==='del'){e.stopPropagation();if(accDel===id){
      PK.forEach(k=>LSRAW.removeItem(id+':'+k));
      accSave(L.filter(a=>a.id!==id));accDel=null;
      if(id===ACC){ACC='';LSRAW.removeItem('dontstop_cur');S={xp:0,games:0,bt:0,br:9,map:0,coins:0,tr:0};ownedSkins=[0];activeSkin=0;ownedAuras=[0];activeAura=0;ownedDeaths=[0];activeDeath=0}
      accMode=accList().length?'list':'create';accRender();
    }else{accDel=id;accRender()}return}
  if(act==='pick'){const a=L.find(x=>x.id===id);if(!a)return;if(a.pin){accSel=id;accMode='pin';accMsg='';accRender()}else loadAccount(id,true);return}
  if(act==='unlock'){const a=L.find(x=>x.id===accSel),v=$('accPin').value;if(a&&hashPin(v,a.id)===a.pin)loadAccount(a.id,true);else{accMsg='Code incorrect';accRender()}return}
  if(act==='new'){accMode='create';accMsg='';accRender();return}
  if(act==='list'){accMode='list';accMsg='';accDel=null;accRender();return}
  if(act==='close'){$('accScreen').classList.remove('show');return}
  if(act==='edit'){if(!curAcc())return;accMode='edit';accDr={};accMsg='';accRender();return}
  if(act==='photo'){accGrab();accFile.click();return}
  if(act==='rmphoto'){accGrab();accPatch(ACC,{photo:''});refreshAccBtn();accRender();return}
  if(act==='color'){accGrab();accPatch(ACC,{color:t.dataset.v});refreshAccBtn();accRender();if(S.games)postScore();return}
  if(act==='emo'){accGrab();accPatch(ACC,{av:t.dataset.v});refreshAccBtn();accRender();if(S.games)postScore();return}
  if(act==='rmpin'){accGrab();accPatch(ACC,{pin:''});accMsg='Code supprimé';accRender();return}
  if(act==='save'){
    const a=curAcc();if(!a)return;accGrab();
    const name=$('accName').value.trim(),pin=$('accPin').value.trim(),mail=$('accMail').value.trim().toLowerCase();
    if(name.length<2){accMsg='Pseudo trop court (2 caractères min.)';accRender();return}
    if(L.some(x=>x.id!==a.id&&x.name.toLowerCase()===name.toLowerCase())){accMsg='Ce pseudo existe déjà';accRender();return}
    if(pin&&!/^\d{4}$/.test(pin)){accMsg='Le code doit faire 4 chiffres';accRender();return}
    if(mail&&!/^[a-z0-9._%+-]+@(gmail|googlemail)\.com$/.test(mail)){accMsg='Entre une adresse Gmail valide';accRender();return}
    const renamed=name!==a.name;
    if(renamed&&S.coins<NAME_COST){accMsg='Changer de pseudo coûte '+NAME_COST+' pièces (tu en as '+S.coins+')';accRender();return}
    const patch={name,mail};if(pin)patch.pin=hashPin(pin,a.id);
    if(renamed){S.coins-=NAME_COST;save();$('coins').textContent=S.coins}
    accPatch(a.id,patch);NAMES[0]=name.toUpperCase();refreshAccBtn();accDr={};accMsg='';
    if(S.games)postScore();toast(renamed?'Pseudo changé (−'+NAME_COST+' pièces)':'Profil enregistré');accMode='list';accRender();return}
  if(act==='make'){
    const name=$('accName').value.trim(),pin=$('accPin').value.trim(),mail=$('accMail').value.trim().toLowerCase();
    if(name.length<2){accMsg='Pseudo trop court (2 caractères min.)';accRender();$('accName').value=name;return}
    if(L.some(a=>a.name.toLowerCase()===name.toLowerCase())){accMsg='Ce pseudo existe déjà';accRender();return}
    if(pin&&!/^\d{4}$/.test(pin)){accMsg='Le code doit faire 4 chiffres';accRender();$('accName').value=name;return}
    if(mail&&!/^[a-z0-9._%+-]+@(gmail|googlemail)\.com$/.test(mail)){accMsg='Entre une adresse Gmail valide';accRender();$('accName').value=name;$('accPin').value=pin;$('accMail').value=mail;return}
    const nid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    // le tout premier compte récupère la progression existante
    PK.forEach(k=>{LSRAW.removeItem(k);LSRAW.removeItem(nid+':'+k)});
    L.push({id:nid,name,pin:pin?hashPin(pin,nid):'',mail,ts:Date.now()});accSave(L);loadAccount(nid,true);
  }
});
$('accBtn').onclick=()=>accOpen('list');
function bootAccounts(){if(curAcc())loadAccount(ACC);else{ACC='';accOpen(accList().length?'list':'create')}}
function showLang(){
  const d=document.createElement('div');d.id='langScreen';
  d.style.cssText='position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#78bd2d,#3d8f1c)';
  d.innerHTML='<div class="accBox"><h2>LANGUE · LANGUAGE</h2><p class="accSub" style="margin:6px 0 12px">Choisis ta langue<br>Choose your language</p><button class="bigAction" data-lang="fr">🇫🇷 FRANÇAIS</button><button class="bigAction" data-lang="en">🇬🇧 ENGLISH</button></div>';
  d.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;const l=b.dataset.lang;
    LSRAW.setItem('dontstop_lang',l);
    if(l==='en'){location.reload();return}
    LANG='fr';d.remove();ACC=LSRAW.getItem('dontstop_cur')||'';bootAccounts()});
  document.body.appendChild(d)}
if(LANG==='en'){
  document.documentElement.lang='en';trNode(document.body);
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')trNode(m.target);else if(m.type==='attributes')trNode(m.target);else m.addedNodes.forEach(trNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
}
if(LANG)bootAccounts();else showLang();
restoreSave().then(r=>{if(r){const sl=LSRAW.getItem('dontstop_lang')||'';if(sl&&sl!==LANG){location.reload();return}ACC=LSRAW.getItem('dontstop_cur')||'';if(LANG)bootAccounts()}});
addEventListener('pagehide',()=>{try{save()}catch(e){}});document.addEventListener('visibilitychange',()=>{if(document.hidden){try{save()}catch(e){}}});

menu();
requestAnimationFrame(n=>{last=n;loop(n)});
</script>
